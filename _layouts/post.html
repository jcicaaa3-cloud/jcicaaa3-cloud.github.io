---
layout: default
---
{%- assign lang = page.lang | default: 'ko' -%}
{%- assign t = site.data.i18n[lang] -%}
<article>
  <h1>{{ page.title | escape }}</h1>
  <p class="meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y-%m-%d' }}</time></p>
{{ content }}
</article>
<p class="back"><a href="{{ t.prefix | append: '/research/' | relative_url }}">{{ t.back }}</a></p>
