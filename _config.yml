title: jcicaaa3
description: "악성코드 분석과 컴퓨터공학 공부 기록"
url: "https://jcicaaa3-cloud.github.io"
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul
encoding: UTF-8
markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: "en"
    values:
      lang: en
      locale: en_US
  - scope:
      path: "ja"
    values:
      lang: ja
      locale: ja_JP
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - SECURITY.md
  - .gitignore
